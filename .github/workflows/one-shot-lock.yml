name: one-shot SDK lockfile

on:
  push:
    branches:
      - hardening/ci-reproducibility-20260930

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
      - name: Generate and validate workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo check --locked --workspace --all-targets
      - name: Remove helper and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-lock.yml
          git add Cargo.lock .github/workflows/one-shot-lock.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: commit reproducible SDK Cargo.lock'
          git push origin HEAD:hardening/ci-reproducibility-20260930
