name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: "rustfmt,clippy"

      - name: Check checked-in live protocol contracts
        run: python3 scripts/check-live-contracts.py

      - name: Check generated gRPC service projection
        run: python3 scripts/generate-live-grpc.py --check

      - name: Compile live-session gRPC descriptor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc \
            --proto_path=contracts/live-session \
            --proto_path=/usr/include \
            --include_imports \
            --include_source_info \
            --descriptor_set_out="$RUNNER_TEMP/live-session.binpb" \
            contracts/live-session/live-session.proto
          test -s "$RUNNER_TEMP/live-session.binpb"
          protoc --decode_raw < "$RUNNER_TEMP/live-session.binpb" \
            > "$RUNNER_TEMP/live-session.descriptor.txt"
          grep -q 'LiveSessionService' "$RUNNER_TEMP/live-session.descriptor.txt"
          grep -q 'Connect' "$RUNNER_TEMP/live-session.descriptor.txt"

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Build release
        run: cargo build --workspace --release
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Re-run protocol contract after native tests
        run: python3 scripts/check-live-contracts.py
